<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanFrame AT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hintergrund: Ken-Burns Slideshow -->
  <div class="bg" id="bg"></div>
  <div class="bg-overlay"></div>

  <div class="launcher">

    <!-- Header: Uhr + Datum -->
    <header class="header">
      <div class="header-left">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
      </div>
      <div class="header-right">
        <div class="weather-widget">
          <span class="weather-icon" data-weather="icon"></span>
          <span class="weather-temp" data-weather="temp"></span>
          <div class="weather-meta">
            <span data-weather="city"></span>
            <span data-weather="text"></span>
          </div>
        </div>
        <div class="alexa-btn" onclick="alexaCommand('open alexa')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
            <path d="M12 7v5l3 3" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Alexa
        </div>
      </div>
    </header>

    <!-- App-Bereich -->
    <section class="section">
      <div class="section-label">Apps</div>
      <div class="app-grid" id="app-grid"></div>
    </section>

    <!-- Smart Home -->
    <section class="section sh-section">
      <div class="section-header">
        <div class="section-label">Smart Home</div>
        <div class="sh-tabs" id="sh-tabs"></div>
      </div>
      <div class="sh-devices" id="sh-devices"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="ambilight-control">
        <div class="ambi-dot" id="ambi-dot"></div>
        <span class="ambi-label">Ambilight</span>
        <div class="toggle on" id="ambi-toggle" onclick="toggleAmbilight()">
          <div class="toggle-knob"></div>
        </div>
      </div>
      <div class="footer-right">
        <button class="footer-btn" onclick="launchApp('com.amazon.venezia')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-right:6px">
            <path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M9 8V6.5a3 3 0 0 1 6 0V8" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          App Store
        </button>
        <button class="footer-btn" onclick="launchApp('com.amazon.firelauncher')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-right:6px">
            <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          Amazon-Modus
        </button>
      </div>
    </footer>

  </div>

  <!-- Screensaver -->
  <div class="saver" aria-hidden="true">
    <div class="saver-bottom">
      <div>
        <div class="saver-clock" id="saver-clock">--:--</div>
        <div class="saver-date" id="saver-date"></div>
      </div>
      <div class="saver-weather">
        <div class="saver-weather-main">
          <span data-weather="icon"></span>
          <span data-weather="temp"></span>
        </div>
        <div class="saver-weather-sub">
          <span data-weather="city"></span> · <span data-weather="text"></span>
        </div>
        <div class="saver-weather-sub">
          <span data-weather="range"></span> · <span data-weather="rain"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="weather.js"></script>
  <script src="ambilight.js"></script>
  <script src="smarthome.js"></script>
  <script>
    // ── Hintergrund: Ken-Burns Slideshow ──────────────────────────────────
    const PHOTOS = [
      'photo-1506905925346-21bda4d32df4', // Schweizer Alpen
      'photo-1464822759023-fed622ff2c3b', // Bergspitzen
      'photo-1476514525535-07fb3b4ae5f1', // Bergsee
      'photo-1501854140801-50d01698950b', // Küste
      'photo-1518173946687-a4c8892bbd9f', // Sonnenaufgang Berge
      'photo-1470770841072-f978cf4d019e', // Spiegelung See
      'photo-1500534314209-a25ddb2bd429', // Grünes Tal
      'photo-1441974231531-c6227db76b6e', // Wald
      'photo-1494500764479-0c8f2919a3d8', // Nordlichter
      'photo-1507525428034-b723cf961d3e', // Tropischer Strand
    ];

    const bgEl = document.getElementById('bg');
    const KB_DIRS = [
      'scale(1.08) translate(-2%, -2%)',
      'scale(1.08) translate(2%, -2%)',
      'scale(1.08) translate(-2%, 2%)',
      'scale(1.08) translate(2%, 2%)',
    ];

    const slides = PHOTOS.map((id, i) => {
      const div = document.createElement('div');
      div.className = 'bg-slide' + (i === 0 ? ' active' : '');
      div.style.backgroundImage = `url(https://images.unsplash.com/${id}?w=1920&q=85&fit=crop)`;
      div.style.transform = KB_DIRS[i % KB_DIRS.length];
      bgEl.appendChild(div);
      return div;
    });

    let cur = 0;
    function nextSlide() {
      slides[cur].classList.remove('active');
      cur = (cur + 1) % slides.length;
      slides[cur].classList.add('active');
      slides[cur].style.transform = KB_DIRS[cur % KB_DIRS.length];
    }
    setInterval(() => { if (!saverActive) nextSlide(); }, 45000);

    // ── Uhr ───────────────────────────────────────────────────────────────
    function tick() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
      const DAYS  = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
      const MONTHS= ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
      document.getElementById('date').textContent =
        DAYS[now.getDay()] + ', ' + now.getDate() + '. ' + MONTHS[now.getMonth()];
    }
    tick();
    setInterval(tick, 10000);

    // ── Apps ──────────────────────────────────────────────────────────────
    fetch('apps.json')
      .then(r => r.json())
      .then(apps => {
        const grid = document.getElementById('app-grid');
        apps.forEach((app, idx) => {
          const tile = document.createElement('div');
          tile.className = 'app-tile';
          tile.tabIndex = 0;
          tile.style.animationDelay = (idx * 0.05) + 's';
          tile.innerHTML = `
            <div class="app-icon-wrap">${app.svg}</div>
            <span class="app-name">${app.name}</span>
          `;
          tile.addEventListener('click', () => launchApp(app.package));
          tile.addEventListener('keydown', e => e.key === 'Enter' && launchApp(app.package));
          grid.appendChild(tile);
        });
      });

    // ── App starten ───────────────────────────────────────────────────────
    function launchApp(pkg) {
      if (window.Android) window.Android.launchApp(pkg);
    }

    // ── Alexa ─────────────────────────────────────────────────────────────
    function alexaCommand(cmd) {
      if (window.Android && window.Android.alexaCommand) window.Android.alexaCommand(cmd);
    }

    // ── Fernbedienungs-Navigation ─────────────────────────────────────────
    document.addEventListener('keydown', e => {
      const focused = document.activeElement;
      if (!focused) return;
      const tiles = [...document.querySelectorAll('.app-tile, .sh-device, .sh-tab, .footer-btn, .alexa-btn')];
      const idx = tiles.indexOf(focused);
      if (idx === -1) { if (tiles.length) tiles[0].focus(); return; }

      const COLS = 5;
      let next = null;
      if (e.key === 'ArrowRight') next = tiles[idx + 1];
      else if (e.key === 'ArrowLeft') next = tiles[idx - 1];
      else if (e.key === 'ArrowDown') next = tiles[idx + COLS] || tiles[idx + 1];
      else if (e.key === 'ArrowUp')   next = tiles[idx - COLS] || tiles[idx - 1];

      if (next) { e.preventDefault(); next.focus(); }
    });
  </script>
  <script src="screensaver.js"></script>
</body>
</html>
