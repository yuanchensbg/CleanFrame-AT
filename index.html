<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanFrame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wallpaper" id="wallpaper">
    <div class="wp-layer active" id="wp-a"></div>
    <div class="wp-layer" id="wp-b"></div>
  </div>
  <div class="shade"></div>

  <div class="home" id="home">

    <header class="topbar">
      <div class="status">
        <span class="clock" id="clock">--:--</span>
        <span class="weather-widget">
          <span class="dot-sep"></span>
          <span data-weather="temp"></span>
          <span class="weather-city" data-weather="city"></span>
        </span>
      </div>

      <nav class="actions">
        <button class="action" data-nav data-action="smarthome" aria-label="Smart Home">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>
        </button>
        <button class="action" data-nav data-action="network" aria-label="Netzwerk" id="net-btn">
          <svg viewBox="0 0 24 24" id="net-icon"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19.3" r="1" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="action" data-nav data-action="art" aria-label="Art Mode">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="M4 17l4.5-4.5 3.5 3.5 2.5-2.5L20 18"/></svg>
        </button>
        <button class="action" data-nav data-action="apps" aria-label="Alle Apps">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
        </button>
        <button class="action" data-nav data-action="settings" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </nav>
    </header>

    <div class="dock-wrap">
      <div class="dock" id="dock"></div>
    </div>
  </div>

  <!-- Art Mode -->
  <div class="art-info" id="art-info">
    <div class="art-clock" id="art-clock">--:--</div>
    <div class="art-sub">
      <span id="art-date"></span>
      <span class="saver-weather"><span class="dot-sep"></span><span data-weather="temp"></span> <span data-weather="text"></span></span>
    </div>
  </div>

  <!-- Smart Home -->
  <aside class="sheet" id="sheet-smarthome" aria-hidden="true">
    <div class="sheet-inner">
      <h2 class="sheet-title">Smart Home</h2>

      <div class="sheet-row" data-nav id="ambi-row" onclick="toggleAmbilight()">
        <div class="row-icon"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="10" rx="1.5"/><path d="M2 4l3 2M22 4l-3 2M2 18l3-2M22 18l-3-2M9 20h6"/></svg></div>
        <div class="row-text"><div class="row-name">Ambilight</div><div class="row-state" id="ambi-state">An</div></div>
        <div class="toggle on" id="ambi-toggle"><div class="toggle-knob"></div></div>
      </div>

      <div class="sheet-label">Geräte <span class="sheet-hint">OK schaltet · ◀ ▶ dimmt</span></div>
      <div class="sh-tabs" id="sh-tabs"></div>
      <div class="sh-devices" id="sh-devices"></div>

      <div class="sheet-label">Govee</div>
      <label class="field" data-nav>
        <span class="field-label" id="govee-key-label">API-Key</span>
        <input id="govee-key" type="text" placeholder="Key aus der Govee-E-Mail" autocomplete="off" spellcheck="false">
      </label>
      <div class="form-error" id="govee-error"></div>
    </div>
  </aside>

  <!-- Alle Apps -->
  <section class="overlay" id="overlay-apps" aria-hidden="true">
    <h2 class="overlay-title">Alle Apps</h2>
    <div class="all-apps" id="all-apps"></div>
  </section>

  <!-- Eigene Webseiten -->
  <section class="overlay" id="overlay-web" aria-hidden="true">
    <h2 class="overlay-title">Webseite hinzufügen</h2>
    <div class="web-layout">
      <div class="web-form">
        <label class="field" data-nav>
          <span class="field-label">Name</span>
          <input id="web-name" type="text" maxlength="20" placeholder="ORF News" autocomplete="off">
        </label>
        <label class="field" data-nav>
          <span class="field-label">Adresse</span>
          <input id="web-url" type="url" placeholder="news.orf.at" autocomplete="off">
        </label>
        <div class="field-label glyph-title">Symbol</div>
        <div class="glyphs" id="web-glyphs"></div>
        <div class="form-error" id="web-error"></div>
        <button class="pill" data-nav id="web-save">Zum Startbildschirm hinzufügen</button>
      </div>
      <div class="web-saved">
        <div class="field-label">Gespeichert</div>
        <div class="web-list" id="web-list"></div>
      </div>
    </div>
  </section>

  <!-- Mediathek -->
  <section class="overlay" id="overlay-media" aria-hidden="true">
    <div class="media-head">
      <h2 class="overlay-title" id="media-heading">Neu in den Mediatheken</h2>
      <div class="media-fields">
        <label class="field media-field" data-nav>
          <span class="field-label">Suchen</span>
          <input id="media-search" type="search" placeholder="Soko Donau, Tatort, Universum …" autocomplete="off">
        </label>
        <label class="field media-field" data-nav>
          <span class="field-label">Link einer Sendung</span>
          <input id="media-link" type="url" placeholder="on.orf.at/video/…" autocomplete="off">
        </label>
      </div>
      <div class="chips" id="media-chips"></div>
    </div>
    <div class="media-status" id="media-status"></div>
    <div class="media-grid" id="media-grid"></div>
    <div class="media-more-wrap"><button class="pill" data-nav id="media-more" hidden>Mehr laden</button></div>
  </section>

  <!-- Player -->
  <div class="player" id="player">
    <video id="video" playsinline></video>
    <div class="player-msg" id="player-msg"></div>
    <div class="player-ui" id="player-ui">
      <div class="player-pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></div>
      <div class="player-info">
        <div class="player-title" id="player-title"></div>
        <div class="player-sub" id="player-sub"></div>
        <div class="player-track"><div class="player-bar" id="player-bar"></div></div>
        <div class="player-row"><span id="player-time">0:00 / 0:00</span><span class="player-help">OK Pause · ◀ ▶ spulen · Zurück beendet</span></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="weather.js"></script>
  <script src="smarthome.js"></script>
  <script src="ambilight.js"></script>
  <script src="main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="mediathek.js"></script>
</body>
</html>
